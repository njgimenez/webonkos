services:
  # Frontend - Static Site
  - type: web
    name: onkos-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VUE_APP_API_URL
        value: https://webiacontrol-back.onrender.com
      - key: VUE_APP_BASE_URL
        value: https://onkosweb.com
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    headers:
      - path: /**
        name: Cache-Control
        value: public, max-age=31536000
      - path: /assets/**
        name: Cache-Control
        value: public, max-age=31536000
      - path: /api/**
        name: Cache-Control
        value: no-cache, no-store, must-revalidate 